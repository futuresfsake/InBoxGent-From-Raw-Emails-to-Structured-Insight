name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Types
        run: mypy
      - name: Tests
        run: pytest --cov=inboxgent --cov-report=xml --cov-report=term-missing
      - name: Static security scan
        run: bandit -q -r src -c pyproject.toml
      - name: Dependency audit
        run: pip-audit
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: coverage.xml
